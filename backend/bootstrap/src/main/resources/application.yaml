spring:
  application:
    name: BookTracker
  threads:
    virtual:
      # Request threads are virtual too; the book sources are asked on virtual threads either way
      enabled: true
  web:
    locale: en
    locale-resolver: fixed
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BOOKTRACKER_ISSUER_URI:http://localhost:8180/realms/booktracker}

booktracker:
  bookdata:
    # Open Library asks for a contact User-Agent
    user-agent: ${BOOKTRACKER_BOOKDATA_USER_AGENT:BookTracker/0.1}
    # Google finds books, the CC0 sources describe the ones we keep (ADR-007); Google does no
    # ISBN lookup (9.7 D7), DNB no search. Every source that can serve a query is asked, in parallel.
    order:
      # The order search hits are listed in
      search: [google_books, open_library]
    # Which source's value wins a field when several describe the same edition (same ISBN):
    # first non-null wins over the list (MergePrecedence in adapter:bookdata). A field's list is
    # looked up as: the language's own list for the field, its `fields`, then the same in `default`.
    # Per-field lists: title, authors, publisher, publication-year, page-count, cover, work-key.
    precedence:
      # Decides the book's language first, the same for every book
      language: [dnb, open_library, google_books]
      default:
        fields: [google_books, open_library, dnb]
        cover: [open_library, google_books]
      by-language:
        # By legal deposit DNB receives essentially every German-language printing, so its record
        # is the authority for these editions
        de:
          fields: [dnb, google_books, open_library]
          cover: [google_books, open_library]
    # One uniform block per provider. `enabled: false` removes it from the running application.
    open-library:
      enabled: ${BOOKTRACKER_OPEN_LIBRARY_ENABLED:true}
      base-url: https://openlibrary.org
      # Generous on purpose: its TLS handshake alone took 2-7 s on some days (9.8, 9.10), and with
      # 1s/3s every call failed. A scan waits for the slowest provider anyway (no deadline, 9.9 Q14)
      connect-timeout: 5s
      read-timeout: 10s
      # The contact User-Agent would allow 3; the limit is per IP and blocking is the penalty
      rate-per-second: 1
    google-books:
      # Enabled without a key, the backend refuses to start (9.7 D3)
      enabled: ${BOOKTRACKER_GOOGLE_BOOKS_ENABLED:true}
      base-url: https://www.googleapis.com
      connect-timeout: 1s
      read-timeout: 3s
      api-key: ${BOOKTRACKER_GOOGLE_BOOKS_API_KEY:}
      # Required from servers Google cannot geolocate (403 otherwise)
      country: DE
    dnb:
      enabled: ${BOOKTRACKER_DNB_ENABLED:true}
      base-url: https://services.dnb.de
      connect-timeout: 1s
      read-timeout: 3s
      # Self-imposed: DNB publishes no limit, and SRU is a public institution's service
      rate-per-second: 1
  catalog:
    # With at least this many local hits a text search does not ask the external sources
    min-local-hits: 5
    # Signs the ids of search hits not stored yet (D28). At least 32 bytes. Empty in dev: a random
    # per-process secret is used and hit ids die with a restart. Required in production.
    hit-id-secret: ${BOOKTRACKER_CATALOG_HIT_ID_SECRET:}
  # Extra password in front of Swagger UI and /v3/api-docs. Empty password (the local default): open.
  # Required on a public server (deploy/backend/compose.yaml)
  api-docs:
    username: ${BOOKTRACKER_API_DOCS_USERNAME:}
    password: ${BOOKTRACKER_API_DOCS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # info shows the build's version and commit (public, used by the deploy workflow)
        include: health, info, metrics

springdoc:
  swagger-ui:
    oauth:
      client-id: booktracker-app
      use-pkce-with-authorization-code-grant: true
