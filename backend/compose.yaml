name: booktracker-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: booktracker_db
      POSTGRES_USER: booktracker_user
      POSTGRES_PASSWORD: booktracker_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    # start-dev keeps everything in an in-memory/file H2 store: fine locally, never for prod.
    # --import-realm reads every *.json from /opt/keycloak/data/import on first start.
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
