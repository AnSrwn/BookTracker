name: Backend

# Pull requests: build and test.
# Push to main: build, test, image, deploy to dev.
# Tag v<major>.<minor>.<patch> on main: build, test, image, deploy to prod.
# See backend/docs/deployment.md.

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every v* tag deploys
    tags: ['v*']
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4.4.4
        with:
          build-root-directory: backend
      - name: Compile
        run: ./gradlew assemble

      - name: Test
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-reports
          path: backend/**/build/reports/tests/
          if-no-files-found: ignore

  image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # The tag check below needs main's history
          fetch-depth: 0

      - name: Choose image tag
        id: tag
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not of the form v<major>.<minor>.<patch>"
              exit 1
            fi
            # Prod only ever runs code that is on main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "gradle_args=-Pversion=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4.4.4
        with:
          build-root-directory: backend

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GRADLE_ARGS: ${{ steps.tag.outputs.gradle_args }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/booktracker-backend:$TAG"
          # GITHUB_SHA ends up in /actuator/info, which the deploy step waits for
          ./gradlew :bootstrap:bootBuildImage --imageName="$image" $GRADLE_ARGS
          docker push "$image"

  deploy-dev:
    needs: image
    # Skipped until the stack exists and its id is set (first setup, docs/deployment.md)
    if: github.ref == 'refs/heads/main' && vars.DEV_STACK_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Deploy to dev
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
        run: >-
          backend/deploy/portainer-deploy.sh backend
          "${{ vars.DEV_STACK_ID }}" backend/deploy/backend/compose.yaml
          "${{ needs.image.outputs.tag }}" "${{ vars.DEV_API_URL }}" "$GITHUB_SHA"

  deploy-prod:
    needs: image
    # Skipped until the stack exists and its id is set (first setup, docs/deployment.md)
    if: startsWith(github.ref, 'refs/tags/v') && vars.PROD_STACK_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Deploy to prod
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
        run: >-
          backend/deploy/portainer-deploy.sh backend
          "${{ vars.PROD_STACK_ID }}" backend/deploy/backend/compose.yaml
          "${{ needs.image.outputs.tag }}" "${{ vars.PROD_API_URL }}" "$GITHUB_SHA"
