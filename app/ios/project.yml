# XcodeGen spec of the iOS app. Generate the Xcode project with `xcodegen` in this folder;
# the .xcodeproj is not in Git. Four configurations match the Android variants (D19).
name: BookTracker

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Dev-Debug: debug
  Dev-Release: release
  Prod-Debug: debug
  Prod-Release: release

configFiles:
  Dev-Debug: Config/Dev-Debug.xcconfig
  Dev-Release: Config/Dev-Release.xcconfig
  Prod-Debug: Config/Prod-Debug.xcconfig
  Prod-Release: Config/Prod-Release.xcconfig

targets:
  BookTracker:
    type: application
    platform: iOS
    sources:
      - path: BookTracker
    info:
      path: BookTracker/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Read by AppDelegate and passed to Kotlin: dev or prod
        BookTrackerFlavor: $(BOOKTRACKER_FLAVOR)
        UILaunchScreen: {}
        # Required by Compose Multiplatform (120 Hz on ProMotion); without it the app aborts after launch
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_NAME: BookTracker
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # The Kotlin framework from shared/app, copied here by embedAndSignAppleFrameworkForXcode
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
        # Kotlin builds iosArm64 and iosSimulatorArm64 only, so no Intel simulator slice
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # Gradle reads and writes outside the sandboxed script paths
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:app:embedAndSignAppleFrameworkForXcode

schemes:
  BookTracker-Dev:
    build:
      targets:
        BookTracker: all
    run:
      config: Dev-Debug
    test:
      config: Dev-Debug
    profile:
      config: Dev-Release
    analyze:
      config: Dev-Debug
    archive:
      config: Dev-Release
  BookTracker-Prod:
    build:
      targets:
        BookTracker: all
    run:
      config: Prod-Debug
    test:
      config: Prod-Debug
    profile:
      config: Prod-Release
    analyze:
      config: Prod-Debug
    archive:
      config: Prod-Release
